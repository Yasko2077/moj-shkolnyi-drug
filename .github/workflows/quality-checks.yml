name: Yntymak quality checks

on:
  push:
    branches:
      - foundation/yntymak-0.9.1
      - test/yntymak-supabase-audit
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yntymak-quality-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-checks:
    name: Static safety and syntax checks
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript, cloud flags, profiles, and election safeguards
        run: node scripts/check-project.mjs
      - name: Build allow-listed static website
        run: node scripts/build-static.mjs
      - name: Test safe preview and staging build configurations
        run: node scripts/test-static-build.mjs
      - name: Verify public bundle excludes private project materials
        run: node scripts/check-static-build.mjs
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL grammar parser
        run: python -m pip install --disable-pip-version-check pglast
      - name: Parse SQL migrations, snapshots, and tests
        run: python scripts/check-sql-syntax.py

  staging-migration-test:
    name: Fresh PostgreSQL 17 migration integration test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Bootstrap baseline and apply ordered migrations
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: bash scripts/test-staging-migrations.sh
