name: Yntymak quality checks

on:
  push:
    branches:
      - foundation/yntymak-0.9.1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yntymak-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static safety and syntax checks
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript, cloud flags, profiles, and election safeguards
        run: node scripts/check-project.mjs
